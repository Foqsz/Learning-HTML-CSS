<!doctype html>

<html lang="pt-br">
  <head>
    <title>pagina de exemplo de DOM</title>
    <meta charset="utf-8" />
    <meta name="author" content="Daniel" />
    <meta name="description" content="descrição bacanuda" />
    <meta name="keywords" content="html5, tecnologia" />

    <link rel="stylesheet" href="css/estilo.css" />
  </head>

  <body>
    <div id="principal">
      <header class="hero">
        <div class="top-bar">
          <p class="title">Curso Javascript Completo</p>
          <p>Olá, seja bem-vendo(a)</p>
        </div>

        <div class="hero-content">
          <h1 id="title">Curso Javascript Completo</h1>
          <p>Aprenda Javascript de verdade</p>
        </div>
      </header>

      <main>
        <section class="content-section">
          <div class="card card-1">
            <img src="imagens/card_01.png" alt="" />
            <p>Seletores</p>
          </div>

          <div class="card card-2">
            <img src="imagens/card_02.jpg" alt="" />
            <p>Posicionamento</p>
          </div>

          <div class="card card-3">
            <img src="imagens/card_03.jpg" alt="" />
            <p>Fontes</p>
          </div>
        </section>

        <section class="content-section">
          <article>
            <header class="content-header">
              <h2>Titulo do article</h2>
            </header>
            <p>Paragrafo 1</p>
            <p>Paragrafo 2</p>
          </article>
        </section>
      </main>

      <footer class="rodape">
        <p>Copyright &copy; 2018</p>
      </footer>
    </div>

    <script>
      let body = document.getElementsByClassName("fx"); //getElementsByClassName retorna um elemento vivo, se tem ou nao a classe fx

      (function () {
        addEventListener("scroll", function () {
          if (pageYOffset > 110 && !body[0]) { //como getElementsByClassName retorna um elemento vivo, se body[0] for undefined, significa que a classe fx nao esta presente
            document.body.classList.add("fx");
          } else if (pageYOffset <= 110 && body[0]) {
            console.log("teste");
            document.body.classList.remove("fx");
          }
        });
      })();
    </script>
  </body>
</html>
