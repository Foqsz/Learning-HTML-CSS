<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div></div>
    <script>
        const tempInit = Date.now();
        let n = 0;
        setTimeout(function(){
            console.log("a cada 2s")
            const tempFinish = Date.now();
            console.log(tempFinish - tempInit)
        }, 2000)

        let str = ""
        var d = document.querySelector("div")
        setTimeout(function(){
            for(let i = 0; i < 1000; i++)
            {
                str += `i: ${i} --`
                d.textContent += str
            }
        })

        const intervalId = setInterval(function(){
            console.log(n++)
            
            if(n === 10)
            {
                clearInterval(intervalId)
                const tempFinal = Date.now();
                console.log(tempInit - tempFinal)
            }
                

        }, 1000)


    </script>
</body>
</html>
