<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json Fake</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(49, 48, 48);
        } 
        .dados{
            width: 50%;
            margin: 0 auto;
        }
        p{
            color: white;
            font-family: Tahoma;
        }
        p:nth-child(1){
            font-size: 20px;
            font-weight: bold;
            color: red;
        }
        p:hover{
            color: rgb(255, 255, 255);
        }
    </style>
</head>
<body>
    <div class="dados"></div>

    <form action="#" method="POST" id="formCadastrar">
        <input type="text" name="title" id="title" placeholder="Title">
        <textarea name="body" id="body" placeholder="Body"></textarea>
        <input type="submit" id="btnPost" value="cadastrar">
    </form>
    <script>
        document.querySelector("#formCadastrar").addEventListener("submit", function(event){
            event.preventDefault();
            newPost(1);
        });

        async function getPostersUsers(id){
            const urlGet = `https://jsonplaceholder.typicode.com/users/${id}/posts`;

            try{
                const response = await fetch(`${urlGet}`)

                if(!response.ok){
                    throw Error("Erro na requisição.")
                }

                const dados = await response.json();

                getDados(dados);
            }catch(error){
                console.log(error);
            }
        }

        getPostersUsers(1);

        async function newPost(userId){
            const urlPost = `https://jsonplaceholder.typicode.com/posts`;
            const body = document.querySelector("#body").value;
            const title = document.querySelector("#title").value;
            try{
                const response = await fetch(`${urlPost}`, 
                { 
                    method: 'POST',
                    body: JSON.stringify({
                            title: title,
                            body: body,
                            userId: userId
                }),
                headers:{
                    'Content-type': 'application/json; charset=UTF-8',
                },
            });

            console.log(response);
            console.log("teste"+response.status);
            const dados = await response.json();
            getDados(dados);
            
            }catch(error){
                console.log(error);
            }
        }

        function getDados(dados){
            const divDados = document.querySelector(".dados");
            divDados.innerHTML = "";

            if (!Array.isArray(dados)) {
                dados = [dados]; // Se for um objeto, transforma em um array para facilitar a iteração
            }

            dados.forEach(post => {
                const article = document.createElement('article');
                const title = document.createElement('p');
                const body = document.createElement('p');
                const userId = document.createElement('p');
                const id = document.createElement('p');
                const hr = document.createElement('hr');

                userId.textContent = `User ID: ${post.userId}`;
                id.textContent = `ID Post: ${post.id}`;
                title.textContent = `Title Post: ${post.title}`;
                body.textContent = `Body Post: ${post.body}`;


                article.appendChild(userId);
                article.appendChild(id);
                article.appendChild(title);
                article.appendChild(body);
                article.appendChild(hr);
                divDados.appendChild(article);

            });

            console.log(dados);
        }
    </script>
</body>
</html>
